<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, initial-scale=1.0">
    <title>Ranchi to Gurgaon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content-box">
        <h1>Will you be my Valentine, Vaishnavi?</h1>
        <h2>Life is short and I want to make it longer, therefore be my valentine because whenever you are with me the time stops. It makes me feel excited and anxious at the same time.</h2>
        <div class="button-container">
            <button id="yes">Always Yes</button>
            <button id="no">No</button>
        </div>
    </div>

    <footer>
        <p>
            <a href="https://github.com/TheDataDesk/Binary-Love" target="_blank">You can find the code HERE</a>
        </p>
        <p>Created by <strong>@TheRoy</strong> | Shomyo Roy</p>
        <p>
            <a>Github</a>
        </p>
    </footer>

    <audio id="background-music" loop>
        <source src="https://raw.githubusercontent.com/shomyoroy/Valentine/main/song.mp3" type="audio/mp3">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0"></script>
    <script defer src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const noButton = document.getElementById('no');
            const yesButton = document.getElementById('yes');
            document.getElementById("background-music").play();
            
            noButton.addEventListener('mouseenter', function () {
                noButton.classList.add('shake');
                generateEvilFaces();
            });
            
            noButton.addEventListener('mouseleave', function () {
                noButton.classList.remove('shake');
            });
            
            yesButton.addEventListener('click', function () {
                alert('Yay! Can’t wait for our dateand last Valentine's Week as fiances! ❤️');
                confetti();
                
            });

            function generateEvilFaces() {
                for (let i = 0; i < 5; i++) {
                    let evilFace = document.createElement('div');
                    evilFace.innerHTML = '😈';
                    evilFace.classList.add('evil-face');
                    document.body.appendChild(evilFace);
                    
                    let x = Math.random() * window.innerWidth;
                    let y = Math.random() * window.innerHeight;
                    
                    evilFace.style.left = `${x}px`;
                    evilFace.style.top = `${y}px`;
                    
                    setTimeout(() => {
                        evilFace.remove();
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
